name: Sales Forecasting MLOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "sales_forecasting_project/deployment/best_model.joblib"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    name: Register and Validate Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sales_forecasting_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r sales_forecasting_project/requirements.txt
      - name: Validate dataset
        run: python sales_forecasting_project/model_building/data_register.py

  data-prep:
    name: Prepare Train/Test Data
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sales_forecasting_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r sales_forecasting_project/requirements.txt
      - name: Prepare data
        run: python sales_forecasting_project/model_building/prep.py
      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: sales-train-test-splits
          path: |
            sales_forecasting_project/artifacts/train.csv
            sales_forecasting_project/artifacts/test.csv
          if-no-files-found: error

  model-training:
    name: Train, Evaluate, and Commit Model
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sales_forecasting_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r sales_forecasting_project/requirements.txt
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: sales-train-test-splits
          path: sales_forecasting_project/artifacts
      - name: Train and tune model
        run: python sales_forecasting_project/model_building/train.py
      - name: Evaluate saved model
        run: python sales_forecasting_project/model_building/evaluate.py
      - name: Commit trained model to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales_forecasting_project/deployment/best_model.joblib
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Update trained sales model [skip ci]"
            git push origin HEAD:main
          fi
